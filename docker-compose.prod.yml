services:
  postgres:
    image: postgres:16-alpine
    container_name: electrosal-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_segura_prod}
      POSTGRES_DB: ${DB_NAME:-sistema_electrosal_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/aleduque75/sistema-erp-electrosal-backend:latest
    pull_policy: always
    container_name: electrosal-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-senha_segura_prod}@postgres:5432/${DB_NAME:-sistema_electrosal_prod}?schema=erp"
      JWT_SECRET: ${JWT_SECRET:-sua_chave_secreta_jwt_electrosal_prod_2026}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_prod_uploads:/app/uploads

  frontend:
    image: ghcr.io/aleduque75/sistema-erp-electrosal-frontend:latest
    pull_policy: always
    container_name: electrosal-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: "https://api.electrosal.com.br"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: electrosal-nginx-prod
    restart: always
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_prod_data:
  backend_prod_uploads:
